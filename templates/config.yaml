# ============================================================================
# Give Me Doc — 内置 Word 模板样式配置（主配置）
# ============================================================================
#
# 概述
# ----
# 本文件定义全局默认值和模板注册列表。
# 每个模板的样式定义拆分为独立 YAML 文件，通过 styles_file 引用。
#
# 构建方式
# --------
#   pnpm build:templates          # 或直接: python3 scripts/build_templates.py
#
# 生成产物:
#   templates/<id>.docx                        — pandoc --reference-doc 用模板
#   src/core/builtin-templates.generated.ts    — base64 内嵌，运行时直接使用
#
# ============================================================================
#
# 配置结构
# --------
#
# defaults:                      # 全局默认值（所有模板共享）
#   page:                        # 页面尺寸与边距
#     width_cm / height_cm       # 页面宽高 (cm)
#     margin_top_cm / ...        # 边距 (cm)
#   paragraph:                   # 段落默认值（应用于 Normal 样式）
#     line_spacing               # 行距倍数
#     space_after_pt             # 段后间距 (pt)
#
# templates:                     # 模板列表，每项包含:
#   - id:          <string>      # 唯一标识符，生成文件名
#     name:        <string>      # 显示名称
#     description: <string>      # 描述文字
#     styles_file: <string>      # 样式定义文件 (相对于 templates/ 目录)
#     page:        { ... }       # (可选) 覆盖全局页面设置
#
# ============================================================================
#
# 可用样式属性（在各模板样式文件中使用）
# ----------------------------------------
#
# 字体属性:
#   font_ascii          西文字体名 (ascii/hAnsi)
#   font_eastAsia       中文字体名 (eastAsia)
#   font_size_pt        字号 (pt, 磅)
#   bold                粗体 (true/false)
#   italic              斜体 (true/false)
#   underline           下划线 (true/false)
#   color               字体颜色 (6 位 hex, 不带 #, 如 "0563C1")
#
# 段落属性:
#   line_spacing         行距倍数 (如 1.5)
#   space_before_pt      段前间距 (pt)
#   space_after_pt       段后间距 (pt)
#   first_line_indent_pt 首行缩进 (pt, 中文常用 24 = 12pt×2字符)
#                        设为负值可实现悬挂缩进 (需配合 indent_left_pt)
#   indent_left_pt       左缩进 (pt)
#   indent_right_pt      右缩进 (pt)
#   alignment            对齐 (left | center | right | justify)
#   keep_with_next       与下段同页 (true/false, 常用于标题/题注)
#   keep_together        段中不分页 (true/false)
#   widow_control        孤行控制 (true/false)
#   page_break_before    段前分页 (true/false)
#
# 表格样式属性 (仅用于 "Table" 样式):
# ----------------------------------------
# 表格样式使用特殊的属性结构，不同于段落/字符样式。
# 注意: 表格内文字字体由 Compact 段落样式控制，不在此处设置。
#
#   table_alignment:             表格在页面中的水平对齐 (left|center|right)
#
#   borders:                     全局表格边框
#     top/bottom/left/right:     外边框
#     insideH/insideV:           内部网格线
#       val:    边框类型 (none|single|double|dotted|dashed|thick)
#       sz:     粗细 (半磅单位, 4=0.5pt, 8=1pt, 12=1.5pt)
#       color:  颜色 (6位 hex 或 "auto")
#       space:  间距 (默认 0)
#
#   cell_margin:                 单元格内边距 (单位: twips, 1pt≈20twips)
#     top/bottom/left/right:     各方向边距值 (整数)
#
#   paragraph:                   表格内段落默认属性 (覆盖 Compact 样式)
#     line_spacing:              行距倍数
#     line_spacing_pt:           行距固定值 (pt, 优先级高于 line_spacing)
#     space_before_pt:           段前 (pt)
#     space_after_pt:            段后 (pt)
#     alignment:                 对齐 (left|center|right|justify)
#
#   font_ascii:                  表格默认西文字体 (可选, 通常用 Compact 控制)
#   font_eastAsia:               表格默认中文字体 (可选)
#   font_size_pt:                表格默认字号 (可选)
#   bold/italic/color:           表格默认文字格式 (可选)
#
#   conditional:                 条件格式 (按区域覆盖默认值)
#     firstRow/lastRow:          表头行 / 表尾行
#     firstCol/lastCol:          首列 / 末列
#     band1Horz/band2Horz:       奇数行 / 偶数行 (交替行底纹)
#     band1Vert/band2Vert:       奇数列 / 偶数列
#     每个条件区段可设:
#       bold/italic/color:       文字格式覆盖
#       font_ascii/font_eastAsia/font_size_pt: 字体覆盖
#       alignment:               对齐覆盖
#       line_spacing/space_before_pt/space_after_pt: 间距覆盖
#       shading:                 背景填充色 (6位 hex, 如 "D9E2F3")
#       vertical_alignment:      垂直对齐 (top|center|bottom)
#       borders:                 边框覆盖 (结构同全局 borders, 使用 tcBorders)
#
# ============================================================================
#
# Pandoc 使用的 Word 样式名参考
# ----------------------------
# 所有模板均已完整覆盖以下全部样式。
# 带 * 号的样式不存在于默认 reference.docx，构建脚本会自动创建。
#
# 正文类 (段落样式):
#   Normal               默认段落（正文基础样式，所有段落继承此样式，包括分隔线）
#   Body Text            正文段落
#   First Paragraph      紧跟标题后的首段（常无缩进或有特殊格式）
#
# 文档元信息 (段落样式):
#   Title                文档标题
#   Subtitle             文档副标题
#   Author               作者
#   Date                 日期
#   Abstract             摘要正文
#   AbstractTitle     *  摘要标题 (如 "摘要"；注意无空格)
#
# 标题层级 (段落样式):
#   Heading 1 – 9        一级到九级标题
#
# 引用 (段落样式):
#   Block Text           块引用 (Markdown "> ...")
#   Footnote Block Text *脚注内块引用
#
# 代码 (段落/字符样式):
#   Source Code        *  代码块段落 (```...```)
#   Verbatim Char        行内代码字符样式 (`...`)
#
# 题注 (段落样式):
#   Caption              通用题注
#   Table Caption        表格题注
#   Image Caption        图片题注
#
# 图片 (段落样式):
#   Figure               图片段落（无题注时）
#   Captioned Figure     带题注图片的容器段落
#
# 列表 (段落样式):
#   Compact              紧凑列表项（列表项之间无空行时使用）
#
# 定义列表 (段落样式):
#   Definition Term      定义术语
#   Definition           定义内容
#
# 脚注 (段落/字符样式):
#   Footnote Text        脚注正文
#   Footnote Reference   脚注引用标记（字符样式）
#
# 目录 (段落样式):
#   TOC Heading          目录标题
#
# 参考文献 (段落样式):
#   Bibliography         参考文献条目
#
# 链接 (字符样式):
#   Hyperlink            超链接
#
# 章节编号 (字符样式):
#   Section Number       章节编号
#
# 表格 (表格样式):
#   Table                表格样式（控制边框/底纹/内边距/条件格式）
#
# ============================================================================
#
# 中文字号与 pt 对照
# ------------------
#   初号 = 42pt    小初 = 36pt    一号 = 26pt    小一 = 24pt
#   二号 = 22pt    小二 = 18pt    三号 = 16pt    小三 = 15pt
#   四号 = 14pt    小四 = 12pt    五号 = 10.5pt  小五 = 9pt
#   六号 = 7.5pt   小六 = 6.5pt   七号 = 5.5pt   八号 = 5pt
#
# ============================================================================

# --- 全局默认值 (各模板可通过 page: 块覆盖) ---
defaults:
  page:
    width_cm: 21.0       # A4
    height_cm: 29.7
    margin_top_cm: 2.54
    margin_bottom_cm: 2.54
    margin_left_cm: 3.18
    margin_right_cm: 3.18

  paragraph:
    line_spacing: 1.5     # 行距倍数
    space_after_pt: 6     # 段后间距 (pt)

# ============================================================================
# 模板列表
# ============================================================================
templates:

  - id: builtin-minimal
    name: 简单样式
    description: 宋体+Times，无额外格式
    styles_file: builtin-minimal.yaml

  - id: builtin-academic
    name: 学术文档风格
    description: 适合学术论文、技术报告
    styles_file: builtin-academic.yaml

  - id: builtin-manual
    name: 企业手册风格
    description: 适合企业文档、操作手册
    styles_file: builtin-manual.yaml

  - id: builtin-gw
    name: 党政公文风格
    description: 参考GB/T 9704公文风格
    styles_file: builtin-gw.yaml
    page:
      margin_top_cm: 3.4
      margin_bottom_cm: 3.5
      margin_left_cm: 2.6
      margin_right_cm: 2.5

  - id: builtin-modern
    name: 现代简约风格
    description: 华文细黑，适合现代报告
    styles_file: builtin-modern.yaml