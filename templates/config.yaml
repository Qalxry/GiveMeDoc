# ============================================================================
# Give Me Doc — 内置 Word 模板样式配置
# ============================================================================
#
# 概述
# ----
# 本文件定义了项目内置的 pandoc reference-doc (.docx) 模板。
# 构建脚本 (scripts/build_templates.py) 读取此配置，基于 pandoc 默认
# reference.docx 修改样式属性，生成可直接使用的模板文件。
#
# 构建方式
# --------
#   pnpm build:templates          # 或直接: python3 scripts/build_templates.py
#
# 生成产物:
#   templates/<id>.docx                        — pandoc --reference-doc 用模板
#   src/core/builtin-templates.generated.ts    — base64 内嵌，运行时直接使用
#
# ============================================================================
#
# 配置结构
# --------
#
# defaults:                      # 全局默认值（所有模板共享）
#   page:                        # 页面尺寸与边距
#     width_cm / height_cm       # 页面宽高 (cm)
#     margin_top_cm              # 上边距 (cm)
#     margin_bottom_cm           # 下边距 (cm)
#     margin_left_cm             # 左边距 (cm)
#     margin_right_cm            # 右边距 (cm)
#   paragraph:                   # 段落默认值（应用于 Normal 样式）
#     line_spacing               # 行距倍数
#     space_after_pt             # 段后间距 (pt)
#
# templates:                     # 模板列表，每项包含:
#   - id:          <string>      # 唯一标识符，生成文件名
#     name:        <string>      # 显示名称
#     description: <string>      # 描述文字
#     page:        { ... }       # (可选) 覆盖全局页面设置
#     styles:                    # 样式定义 (键名 = Word 样式名)
#       <StyleName>:
#         <属性>: <值>
#
# ============================================================================
#
# 可用样式属性
# ------------
#
# 字体属性:
#   font_ascii          西文字体名 (ascii/hAnsi)
#   font_eastAsia       中文字体名 (eastAsia)
#   font_size_pt        字号 (pt, 磅)
#   bold                粗体 (true/false)
#   italic              斜体 (true/false)
#   color               字体颜色 (6 位 hex, 不带 #, 如 "0563C1")
#
# 段落属性:
#   line_spacing         行距倍数 (如 1.5)
#   space_before_pt      段前间距 (pt)
#   space_after_pt       段后间距 (pt)
#   first_line_indent_pt 首行缩进 (pt, 中文常用 24 = 12pt×2字符)
#   alignment            对齐 (left | center | right | justify)
#
# ============================================================================
#
# Pandoc 使用的 Word 样式名参考
# ----------------------------
# 下列样式名与 pandoc 输出的 docx 中实际使用的样式一一对应。
# 未在模板中定义的样式将保留 pandoc 默认外观。
# 带 * 号的样式不存在于默认 reference.docx，构建脚本会自动创建。
#
# 正文类:
#   Normal               默认段落（正文基础样式，所有段落继承此样式）
#   Body Text            正文段落
#   First Paragraph      紧跟标题后的首段（常无缩进或有特殊格式）
#
# 文档元信息:
#   Title                文档标题
#   Subtitle             文档副标题
#   Author               作者
#   Date                 日期
#   Abstract             摘要正文
#   Abstract Title       摘要标题 (如 "摘要")
#
# 标题层级:
#   Heading 1 – 9        一级到九级标题 (常用 1–6)
#
# 引用:
#   Block Text           块引用 (Markdown "> ...")
#
# 代码:
#   Source Code        *  代码块段落 (```...```)
#   Verbatim Char        行内代码字符样式 (`...`)
#
# 题注:
#   Caption              通用题注
#   Table Caption        表格题注
#   Image Caption        图片题注
#   Captioned Figure     带题注图片的容器段落
#
# 列表:
#   Compact              紧凑列表项（列表项之间无空行时使用）
#
# 定义列表:
#   Definition Term      定义术语
#   Definition           定义内容
#
# 脚注:
#   Footnote Text        脚注正文
#   Footnote Reference   脚注引用标记（字符样式）
#
# 目录:
#   TOC Heading          目录标题
#
# 链接:
#   Hyperlink            超链接（字符样式）
#
# 其他:
#   Figure               图片段落
#   Bibliography         参考文献条目
#   Section Number       章节编号（字符样式）
#
# ============================================================================
#
# 中文字号与 pt 对照
# ------------------
#   初号 = 42pt    小初 = 36pt    一号 = 26pt    小一 = 24pt
#   二号 = 22pt    小二 = 18pt    三号 = 16pt    小三 = 15pt
#   四号 = 14pt    小四 = 12pt    五号 = 10.5pt  小五 = 9pt
#   六号 = 7.5pt   小六 = 6.5pt   七号 = 5.5pt   八号 = 5pt
#
# ============================================================================

# --- 全局默认值 (各模板可通过 page: 块覆盖) ---
defaults:
  page:
    width_cm: 21.0       # A4
    height_cm: 29.7
    margin_top_cm: 2.54
    margin_bottom_cm: 2.54
    margin_left_cm: 3.18
    margin_right_cm: 3.18

  paragraph:
    line_spacing: 1.5     # 行距倍数
    space_after_pt: 6     # 段后间距 (pt)

