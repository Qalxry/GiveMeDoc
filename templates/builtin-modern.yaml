    top: 50
    bottom: 50
    left: 120
    right: 120
  paragraph:
    line_spacing: 1.0
    space_before_pt: 0
    space_after_pt: 0
    alignment: center
  conditional:
    firstRow:
      bold: true
      color: "000000"
      alignment: center
