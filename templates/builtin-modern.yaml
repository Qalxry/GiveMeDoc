# ── 表格 ────────────────────────────────────────────────────
# 现代商务：深蓝表头 + 精致细线 + 交替行底纹
"Table":
  table_alignment: center
  borders:
    top:      { val: single, sz: 6, color: "1A5276" }
    bottom:   { val: single, sz: 6, color: "1A5276" }
    left:     { val: none }
    right:    { val: none }
    insideH:  { val: single, sz: 4, color: "D5DBDB" }
    insideV:  { val: none }
  cell_margin:
    top: 50
    bottom: 50
    left: 120
    right: 120
  paragraph:
    line_spacing: 1.15
    space_before_pt: 2
    space_after_pt: 2
    alignment: center
  conditional:
    firstRow:
      bold: true
      color: "FFFFFF"
      alignment: center
      shading: "1A5276"
      borders:
        bottom: { val: single, sz: 6, color: "1A5276" }
      vertical_alignment: center
    band1Horz:
      shading: "EBF5FB"

